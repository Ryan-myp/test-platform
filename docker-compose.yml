version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - AI_API_KEY=${AI_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-testpilot-secret-key}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Redis 缓存（可选）
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
