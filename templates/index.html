<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TestPilot Pro - 智能测试平台</title>
<style>
:root {
  --bg: #0a0e1a; --surface: #111827; --card: #1a2235; --border: #2a3550;
  --primary: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
  --text: #e2e8f0; --muted: #64748b; --accent: #8b5cf6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.app { display: flex; height: 100vh; }

/* Sidebar */
.sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
.logo { padding: 20px; border-bottom: 1px solid var(--border); }
.logo h1 { font-size: 20px; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo span { font-size: 11px; color: var(--muted); }
.nav { flex: 1; padding: 12px; overflow-y: auto; }
.nav-section { margin-bottom: 16px; }
.nav-section-title { font-size: 10px; text-transform: uppercase; color: var(--muted); padding: 8px 12px; letter-spacing: 1px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s; color: var(--muted); font-size: 13px; }
.nav-item:hover { background: var(--card); color: var(--text); }
.nav-item.active { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(139,92,246,0.2)); color: var(--primary); }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.sidebar-footer { padding: 16px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--surface); }
.header h2 { font-size: 18px; font-weight: 600; }
.header-actions { display: flex; gap: 8px; }
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* Cards */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.stat-card .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.stat-card .value { font-size: 28px; font-weight: 700; }
.stat-card .value.blue { color: var(--primary); }
.stat-card .value.green { color: var(--success); }
.stat-card .value.yellow { color: var(--warning); }
.stat-card .value.red { color: var(--danger); }
.stat-card .value.purple { color: var(--accent); }

.entries-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.entry-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; cursor: pointer; transition: all 0.2s; }
.entry-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.entry-card .icon { font-size: 28px; margin-bottom: 12px; }
.entry-card .name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.entry-card .desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
.entry-card .auto-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 10px; margin-top: 10px; background: rgba(16,185,129,0.2); color: var(--success); }

/* Form */
.form-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
.form-panel h3 { font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 13px; font-family: inherit;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--primary);
}
.form-group textarea { min-height: 100px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* Buttons */
.btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; }
.btn-primary:hover { opacity: 0.9; }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-sm { padding: 5px 10px; font-size: 11px; }

/* Tables */
.table-container { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 16px; text-align: left; font-size: 13px; }
th { background: var(--surface); color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
td { border-top: 1px solid var(--border); }
tr:hover td { background: rgba(59,130,246,0.05); }
.badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; }
.badge-success { background: rgba(16,185,129,0.2); color: var(--success); }
.badge-warning { background: rgba(245,158,11,0.2); color: var(--warning); }
.badge-danger { background: rgba(239,68,68,0.2); color: var(--danger); }
.badge-info { background: rgba(59,130,246,0.2); color: var(--primary); }
.badge-muted { background: rgba(100,116,139,0.2); color: var(--muted); }

/* Pipeline */
.pipeline { display: flex; gap: 0; margin: 20px 0; }
.pipeline-step { flex: 1; text-align: center; position: relative; }
.pipeline-step::after { content: ''; position: absolute; top: 15px; left: 50%; width: 100%; height: 2px; background: var(--border); z-index: 0; }
.pipeline-step:last-child::after { display: none; }
.pipeline-step .dot { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; position: relative; z-index: 1; }
.pipeline-step.active .dot { border-color: var(--primary); background: var(--primary); }
.pipeline-step.done .dot { border-color: var(--success); background: var(--success); }
.pipeline-step .label { font-size: 11px; color: var(--muted); margin-top: 8px; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 90%; max-width: 800px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
.modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h3 { font-size: 16px; }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

/* Results */
.result-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 16px; }
.result-box pre { white-space: pre-wrap; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text); line-height: 1.6; }
.screenshot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.screenshot-item { border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
.screenshot-item img { width: 100%; height: 120px; object-fit: cover; }
.screenshot-item .info { padding: 8px; font-size: 11px; color: var(--muted); }

/* Tabs */
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab { padding: 10px 20px; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* Loading */
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-overlay { position: fixed; inset: 0; background: rgba(10,14,26,0.9); display: flex; align-items: center; justify-content: center; z-index: 2000; flex-direction: column; gap: 16px; }
.loading-overlay .spinner { width: 40px; height: 40px; border-width: 3px; }
.loading-overlay p { color: var(--muted); font-size: 14px; }

/* Toast */
.toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 13px; z-index: 3000; animation: slideIn 0.3s ease; }
.toast-success { background: var(--success); color: white; }
.toast-error { background: var(--danger); color: white; }
.toast-info { background: var(--primary); color: white; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Knowledge tags */
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; background: var(--surface); color: var(--muted); margin: 2px; }

/* Responsive */
@media (max-width: 1200px) { .entries-grid { grid-template-columns: repeat(2, 1fr); } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 768px) { .sidebar { display: none; } .entries-grid { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <h1>🚀 TestPilot Pro</h1>
      <span>智能测试平台 v2.0</span>
    </div>
    <nav class="nav">
      <div class="nav-section">
        <div class="nav-section-title">主页</div>
        <div class="nav-item active" data-page="dashboard"><span class="icon">📊</span>数据概览</div>
        <div class="nav-item" data-page="entries"><span class="icon">⚡</span>任务入口</div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">执行</div>
        <div class="nav-item" data-page="browser"><span class="icon">🌐</span>浏览器测试</div>
        <div class="nav-item" data-page="pipelines"><span class="icon">🔗</span>流水线</div>
        <div class="nav-item" data-page="tasks"><span class="icon">📋</span>任务历史</div>
      </div>
      <div class="nav-section">
        <div class="nav-section-title">管理</div>
        <div class="nav-item" data-page="knowledge"><span class="icon">📚</span>知识库</div>
        <div class="nav-item" data-page="schedules"><span class="icon">⏰</span>定时任务</div>
        <div class="nav-item" data-page="config"><span class="icon">⚙️</span>系统配置</div>
        <div class="nav-item" data-page="screenshots"><span class="icon">🖼️</span>截图库</div>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div>AI: <span id="ai-status">● 未配置</span></div>
      <div>DB: <span id="db-status">● SQLite</span></div>
    </div>
  </aside>
  <main class="main">
    <div class="header">
      <h2 id="page-title">数据概览</h2>
      <div class="header-actions">
        <button class="btn btn-secondary btn-sm" onclick="loadStats()">🔄 刷新</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="toast-container"></div>
<div id="loading" style="display:none" class="loading-overlay"><div class="spinner"></div><p>处理中...</p></div>

<script>
const API = '/api';
let currentPage = 'dashboard';

// ── 页面路由 ─────────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    const page = el.dataset.page;
    currentPage = page;
    document.getElementById('page-title').textContent = el.textContent.trim();
    renderPage(page);
  });
});

async function renderPage(page) {
  const content = document.getElementById('content');
  showLoading(true);
  try {
    switch(page) {
      case 'dashboard': await renderDashboard(content); break;
      case 'entries': await renderEntries(content); break;
      case 'browser': await renderBrowser(content); break;
      case 'pipelines': await renderPipelines(content); break;
      case 'tasks': await renderTasks(content); break;
      case 'knowledge': await renderKnowledge(content); break;
      case 'schedules': await renderSchedules(content); break;
      case 'config': await renderConfig(content); break;
      case 'screenshots': await renderScreenshots(content); break;
      default: content.innerHTML = '<p>页面未找到</p>';
    }
  } catch(e) { showToast('加载失败: ' + e.message, 'error'); }
  showLoading(false);
}

// ── Dashboard ────────────────────────────────────────────────
async function renderDashboard(el) {
  const stats = await api('/stats');
  const tasks = await api('/tasks?limit=10');
  el.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">总任务数</div><div class="value blue">${stats.total_tasks || 0}</div></div>
      <div class="stat-card"><div class="label">今日完成</div><div class="value green">${stats.today_tasks || 0}</div></div>
      <div class="stat-card"><div class="label">知识库条目</div><div class="value purple">${stats.total_knowledge || 0}</div></div>
      <div class="stat-card"><div class="label">定时任务</div><div class="value yellow">${stats.total_schedules || 0}</div></div>
    </div>
    <div class="table-container">
      <table><thead><tr><th>ID</th><th>类型</th><th>标题</th><th>状态</th><th>创建时间</th></tr></thead>
      <tbody>${(tasks.data||[]).map(t => `<tr>
        <td>#${t.id}</td><td><span class="badge badge-info">${t.entry_type}</span></td>
        <td>${t.title}</td>
        <td><span class="badge ${t.status==='success'?'badge-success':t.status==='running'?'badge-info':'badge-danger'}">${t.status}</span></td>
        <td>${fmtTime(t.created_at)}</td>
      </tr>`).join('')}</tbody></table>
    </div>
  `;
}

async function loadStats() { renderPage(currentPage); }

// ── 任务入口 ─────────────────────────────────────────────────
async function renderEntries(el) {
  const entries = await api('/entries');
  const templates = await api('/tasks/templates');
  
  el.innerHTML = `
    <h3 style="margin-bottom:16px;font-size:14px;color:var(--muted)">🧪 核心测试入口</h3>
    <div class="entries-grid">
      ${Object.entries(entries).map(([key, e]) => `
        <div class="entry-card" onclick="openEntry('${key}')">
          <div class="icon">${e.icon}</div>
          <div class="name">${e.name}</div>
          <div class="desc">${e.desc}</div>
          ${e.auto_execute ? `<span class="auto-badge">⚡ 自动执行: ${e.auto_execute.desc}</span>` : ''}
        </div>
      `).join('')}
    </div>
    <h3 style="margin:24px 0 16px;font-size:14px;color:var(--muted)">🔗 快捷流水线</h3>
    <div class="entries-grid">
      ${Object.entries(templates.templates||{}).map(([key, p]) => `
        <div class="entry-card" onclick="runPipeline('${key}')">
          <div class="icon">🔗</div>
          <div class="name">${p.name}</div>
          <div class="desc">${p.desc}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function openEntry(key) {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header"><h3 id="modal-title">加载中...</h3><button class="btn btn-secondary btn-sm" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
      <div class="modal-body" id="modal-body"><div class="spinner"></div></div>
      <div class="modal-footer"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">取消</button><button class="btn btn-primary" id="modal-submit">执行</button></div>
    </div>
  `;
  document.body.appendChild(modal);
  loadEntryForm(key, modal);
}

async function loadEntryForm(key, modal) {
  const entries = await api('/entries');
  const entry = entries[key];
  if (!entry) return;
  
  document.getElementById('modal-title').textContent = `${entry.icon} ${entry.name}`;
  let formHtml = entry.fields.map(f => `
    <div class="form-group">
      <label>${f.label}${f.required ? ' *' : ''}</label>
      ${f.type === 'textarea' ? `<textarea id="field-${f.key}" placeholder="${f.placeholder||''}" ${f.required?'required':''}></textarea>` :
        f.type === 'select' ? `<select id="field-${f.key}">${(f.options||[]).map(o=>`<option>${o}</option>`).join('')}</select>` :
        `<input type="${f.type||'text'}" id="field-${f.key}" value="${f.default||''}" placeholder="${f.placeholder||''}">`
      }
    </div>
  `).join('');
  
  document.getElementById('modal-body').innerHTML = formHtml;
  document.getElementById('modal-submit').onclick = async () => {
    const data = {};
    entry.fields.forEach(f => { data[f.key] = document.getElementById(`field-${f.key}`).value; });
    document.querySelector('.modal-footer').style.display = 'none';
    await submitTask(key, data, modal);
  };
}

async function submitTask(entryType, data, modal) {
  try {
    const res = await api('/tasks', 'POST', { entry_type: entryType, input_data: data });
    modal.innerHTML = `<div class="result-box"><pre>${JSON.stringify(res, null, 2)}</pre></div>`;
    document.querySelector('.modal-footer').style.display = 'flex';
    showToast('任务已提交', 'success');
  } catch(e) {
    showToast('提交失败: ' + e.message, 'error');
  }
}

// ── 浏览器测试 ────────────────────────────────────────────────
async function renderBrowser(el) {
  el.innerHTML = `
    <div class="tabs">
      <div class="tab active" onclick="switchTab(this,'browser-manual')">手动执行</div>
      <div class="tab" onclick="switchTab(this,'browser-ai')">AI 自动生成</div>
      <div class="tab" onclick="switchTab(this,'browser-history')">执行历史</div>
    </div>
    <div id="browser-manual" class="tab-content active">
      <div class="form-panel">
        <h3>🌐 Web UI 自动化测试</h3>
        <div class="form-row">
          <div class="form-group"><label>目标 URL *</label><input type="text" id="bt-url" placeholder="https://example.com"></div>
          <div class="form-group"><label>视口大小</label><input type="text" id="bt-viewport" value="1920x1080"></div>
        </div>
        <div class="form-group"><label>测试用例 (JSON数组)</label>
          <textarea id="bt-cases" rows="8" placeholder='[{"id":"TC001","name":"登录测试","steps":[{"action":"fill","target":"input[name=email]","value":"test@example.com"},{"action":"click","target":"button[type=submit]"},{"action":"screenshot","target":""}]}]'></textarea>
        </div>
        <button class="btn btn-primary" onclick="execBrowserTest()">🚀 执行浏览器测试</button>
      </div>
      <div id="bt-result"></div>
    </div>
    <div id="browser-ai" class="tab-content">
      <div class="form-panel">
        <h3>🤖 AI 生成 + 执行测试</h3>
        <div class="form-row">
          <div class="form-group"><label>目标网站 URL *</label><input type="text" id="ai-url" placeholder="https://example.com"></div>
          <div class="form-group"><label>优先级</label><select id="ai-priority"><option>P0</option><option selected>P1</option><option>P2</option></select></div>
        </div>
        <div class="form-group"><label>测试功能描述 *</label><textarea id="ai-feature" rows="3" placeholder="例如：用户登录功能，包括用户名密码登录、验证码登录、记住我等功能"></textarea></div>
        <button class="btn btn-primary" onclick="execAI_BROWSERTest()">🚀 AI 生成并执行</button>
      </div>
      <div id="ai-result"></div>
    </div>
    <div id="browser-history" class="tab-content">
      <div id="bt-history"></div>
    </div>
  `;
}

async function execBrowserTest() {
  const url = document.getElementById('bt-url').value;
  const casesRaw = document.getElementById('bt-cases').value;
  const viewportStr = document.getElementById('bt-viewport').value;
  if (!url || !casesRaw) return showToast('请填写 URL 和测试用例', 'error');
  
  let cases = [];
  try { cases = JSON.parse(casesRaw); } catch(e) { return showToast('JSON 格式错误', 'error'); }
  
  const viewport = viewportStr.match(/(\d+)x(\d+)/);
  const res = await api('/browser/execute', 'POST', {
    url, cases,
    viewport: viewport ? {width: parseInt(viewport[1]), height: parseInt(viewport[2])} : undefined,
    task_title: `浏览器测试 ${new Date().toLocaleString()}`
  });
  document.getElementById('bt-result').innerHTML = `<div class="result-box"><pre>${JSON.stringify(res, null, 2)}</pre></div>`;
  showToast('测试执行完成', 'success');
}

async function execAI_BROWSERTest() {
  const url = document.getElementById('ai-url').value;
  const feature = document.getElementById('ai-feature').value;
  const priority = document.getElementById('ai-priority').value;
  if (!url || !feature) return showToast('请填写完整信息', 'error');
  
  const res = await api('/browser/ai-execute', 'POST', { url, feature, priority, task_title: `AI测试 ${new Date().toLocaleString()}` });
  document.getElementById('ai-result').innerHTML = `<div class="result-box"><pre>${JSON.stringify(res, null, 2)}</pre></div>`;
  showToast('AI测试完成', 'success');
}

// ── 流水线 ───────────────────────────────────────────────────
async function renderPipelines(el) {
  const pipelines = await api('/tasks/pipeline');
  const templates = await api('/tasks/templates');
  el.innerHTML = `
    <h3 style="margin-bottom:16px;font-size:14px;color:var(--muted)">📋 运行中的流水线</h3>
    <div id="pl-running">${(pipelines.data||[]).filter(p=>p.status!=='completed').map(p => `
      <div class="form-panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <strong>${p.name}</strong>
          <span class="badge ${p.status==='running'?'badge-info':'badge-muted'}">${p.status}</span>
        </div>
        <div class="pipeline">
          ${(JSON.parse(p.steps||'[]')||[]).map((s,i) => `<div class="pipeline-step ${i<(p.current_step||0)?'done':''} ${i===(p.current_step||0)?'active':''}">
            <div class="dot">${i<(p.current_step||0)?'✓':(i+1)}</div>
            <div class="label">${s.desc||''}</div>
          </div>`).join('')}
        </div>
      </div>
    `).join('') || '<p style="color:var(--muted)">暂无运行中的流水线</p>'}
    
    <h3 style="margin:24px 0 16px;font-size:14px;color:var(--muted)">🔧 可用流水线模板</h3>
    <div class="entries-grid">
      ${Object.entries(templates.templates||{}).map(([key, p]) => `
        <div class="entry-card">
          <div class="icon">🔗</div>
          <div class="name">${p.name}</div>
          <div class="desc">${p.desc}</div>
          <button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="runPipeline('${key}')">运行</button>
        </div>
      `).join('')}
    </div>
  `;
}

async function runPipeline(key) {
  try {
    const res = await api(`/tasks/pipeline/${key}`, 'POST');
    showToast(`流水线已启动: ${res.pipeline_id}`, 'success');
    renderPage('pipelines');
  } catch(e) { showToast('启动失败: ' + e.message, 'error'); }
}

// ── 任务历史 ─────────────────────────────────────────────────
async function renderTasks(el) {
  const tasks = await api('/tasks?limit=50');
  el.innerHTML = `
    <div class="table-container">
      <table><thead><tr><th>ID</th><th>类型</th><th>标题</th><th>状态</th><th>AI输出</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody>${(tasks.data||[]).map(t => `<tr>
        <td>#${t.id}</td>
        <td><span class="badge badge-info">${t.entry_type}</span></td>
        <td>${t.title}</td>
        <td><span class="badge ${t.status==='success'?'badge-success':t.status==='running'?'badge-info':'badge-danger'}">${t.status}</span></td>
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(t.ai_output||'').substring(0,50)}...</td>
        <td>${fmtTime(t.created_at)}</td>
        <td><button class="btn btn-secondary btn-sm" onclick="viewTask(${t.id})">详情</button></td>
      </tr>`).join('')}</tbody></table>
    </div>
  `;
}

async function viewTask(id) {
  const t = await api(`/tasks/${id}`);
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `<div class="modal">
    <div class="modal-header"><h3>任务 #${t.id}</h3><button class="btn btn-secondary btn-sm" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
    <div class="modal-body">
      <div class="result-box"><pre>${JSON.stringify(t, null, 2)}</pre></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">关闭</button></div>
  </div>`;
  document.body.appendChild(modal);
}

// ── 知识库 ───────────────────────────────────────────────────
async function renderKnowledge(el) {
  const kb = await api('/knowledge?limit=50');
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="font-size:14px;color:var(--muted)">📚 知识库 (${kb.total||0} 条)</h3>
      <button class="btn btn-primary btn-sm" onclick="showAddKB()">+ 新增条目</button>
    </div>
    <div class="table-container">
      <table><thead><tr><th>ID</th><th>分类</th><th>标题</th><th>标签</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody>${(kb.data||[]).map(k => `<tr>
        <td>#${k.id}</td>
        <td><span class="badge badge-info">${k.category}</span></td>
        <td>${k.title}</td>
        <td>${(JSON.parse(k.tags||'[]')||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</td>
        <td>${fmtTime(k.created_at)}</td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick="viewKB(${k.id})">查看</button>
          <button class="btn btn-danger btn-sm" onclick="delKB(${k.id})">删除</button>
        </td>
      </tr>`).join('')}</tbody></table>
    </div>
    <div id="kb-detail"></div>
  `;
}

function showAddKB() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `<div class="modal" style="max-width:600px">
    <div class="modal-header"><h3>新增知识条目</h3><button class="btn btn-secondary btn-sm" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>分类</label><select id="kb-cat"><option>用例规范</option><option>Bug案例</option><option>需求文档</option><option>日志规范</option><option>表结构</option></select></div>
      <div class="form-group"><label>标题</label><input id="kb-title"></div>
      <div class="form-group"><label>内容</label><textarea id="kb-content" rows="6"></textarea></div>
      <div class="form-group"><label>标签（逗号分隔）</label><input id="kb-tags" placeholder="API, 登录, 安全"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="addKB(${modal})">保存</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

async function addKB(modal) {
  const cat = document.getElementById('kb-cat').value;
  const title = document.getElementById('kb-title').value;
  const content = document.getElementById('kb-content').value;
  const tags = document.getElementById('kb-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  if (!title || !content) return showToast('请填写标题和内容', 'error');
  await api('/knowledge', 'POST', { category: cat, title, content, tags });
  modal.closest('.modal-overlay').remove();
  showToast('保存成功', 'success');
  renderPage('knowledge');
}

async function viewKB(id) {
  const k = await api(`/knowledge/${id}`);
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `<div class="modal" style="max-width:700px">
    <div class="modal-header"><h3>${k.title}</h3><button class="btn btn-secondary btn-sm" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
    <div class="modal-body"><div class="result-box"><pre>${k.content}</pre></div></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">关闭</button></div>
  </div>`;
  document.body.appendChild(modal);
}

async function delKB(id) {
  if (!confirm('确认删除？')) return;
  await api(`/knowledge/${id}`, 'DELETE');
  showToast('已删除', 'success');
  renderPage('knowledge');
}

// ── 定时任务 ─────────────────────────────────────────────────
async function renderSchedules(el) {
  const schedules = await api('/schedules');
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 style="font-size:14px;color:var(--muted)">⏰ 定时任务 (${schedules.total||0} 个)</h3>
      <button class="btn btn-primary btn-sm" onclick="showAddSchedule()">+ 新建定时任务</button>
    </div>
    <div class="table-container">
      <table><thead><tr><th>ID</th><th>名称</th><th>入口类型</th><th>Cron</th><th>状态</th><th>下次执行</th><th>操作</th></tr></thead>
      <tbody>${(schedules.data||[]).map(s => `<tr>
        <td>#${s.id}</td><td>${s.name}</td><td><span class="badge badge-info">${s.entry_type}</span></td>
        <td><code>${s.schedule_expr}</code></td>
        <td><span class="badge ${s.enabled?'badge-success':'badge-muted'}">${s.enabled?'启用':'禁用'}</span></td>
        <td>${s.next_run_at||'-'}</td>
        <td>
          <button class="btn btn-secondary btn-sm" onclick="toggleSchedule(${s.id})">${s.enabled?'停用':'启用'}</button>
          <button class="btn btn-danger btn-sm" onclick="delSchedule(${s.id})">删除</button>
        </td>
      </tr>`).join('')}</tbody></table>
    </div>
  `;
}

function showAddSchedule() {
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `<div class="modal" style="max-width:500px">
    <div class="modal-header"><h3>新建定时任务</h3><button class="btn btn-secondary btn-sm" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>任务名称</label><input id="sch-name"></div>
      <div class="form-group"><label>入口类型</label><select id="sch-type">${['generate_cases','analyze_bug','troubleshoot_logs','analyze_sql','generate_report','regression'].map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="form-group"><label>Cron 表达式</label><input id="sch-cron" value="0 9 * * *" placeholder="每天9:00"></div>
      <div class="form-group"><label>输入数据 (JSON)</label><textarea id="sch-data" rows="4" placeholder='{"requirement":"每日检查..."}'></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">取消</button>
      <button class="btn btn-primary" onclick="addSchedule()">创建</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}

async function addSchedule() {
  const name = document.getElementById('sch-name').value;
  const entry_type = document.getElementById('sch-type').value;
  const schedule_expr = document.getElementById('sch-cron').value;
  const input_data = document.getElementById('sch-data').value;
  if (!name || !schedule_expr) return showToast('请填写名称和Cron', 'error');
  await api('/schedules', 'POST', { name, entry_type, schedule_expr, input_data: input_data || '{}' });
  showAddSchedule().closest?.('modal-overlay')?.remove() || document.querySelector('.modal-overlay')?.remove();
  showToast('创建成功', 'success');
  renderPage('schedules');
}

async function toggleSchedule(id) { await api(`/schedules/${id}/toggle`, 'POST'); renderPage('schedules'); }
async function delSchedule(id) { if(confirm('确认删除？')) { await api(`/schedules/${id}`, 'DELETE'); renderPage('schedules'); } }

async function saveAIConfig() {
  await api('/config', 'POST', {
    section: 'ai',
    config: {
      api_key: document.getElementById('cfg-api-key').value,
      base_url: document.getElementById('cfg-base-url').value,
      model: document.getElementById('cfg-model').value,
    }
  });
  showToast('AI 配置已保存', 'success');
  document.getElementById('ai-status').textContent = '● ' + (document.getElementById('cfg-api-key').value ? '已配置' : '未配置');
}

async function saveIntegrationConfig() {
  await api('/config', 'POST', {
    section: 'integrations',
    config: {
      jira_base_url: document.getElementById('cfg-jira-url').value,
      jira_token: document.getElementById('cfg-jira-token').value,
      kibana_base_url: document.getElementById('cfg-kibana-url').value,
      kibana_api_key: document.getElementById('cfg-kibana-key').value,
      webhook_url: document.getElementById('cfg-webhook').value,
    }
  });
  showToast('集成配置已保存', 'success');
}

// ── 截图库 ───────────────────────────────────────────────────
async function renderScreenshots(el) {
  const data = await api('/browser/screenshots');
  el.innerHTML = `
    <h3 style="margin-bottom:16px;font-size:14px;color:var(--muted)">🖼️ 测试截图 (${data.screenshots?.length||0} 张)</h3>
    <div class="screenshot-grid">
      ${(data.screenshots||[]).map(s => `
        <div class="screenshot-item">
          <img src="${s.path}" alt="${s.name}" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 120%22><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%2364748b%22 font-size=%2212%22>暂无预览</text></svg>'">
          <div class="info">${s.name}<br>${(s.size/1024).toFixed(1)} KB</div>
        </div>
      `).join('')}
    </div>
  `;
}

// ── 工具函数 ─────────────────────────────────────────────────
function api(path, method='GET', body=null) {
  const opts = { method, headers: {'Content-Type': 'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  return fetch(API + path, opts).then(r => {
    if (!r.ok) return r.json().then(e => Promise.reject(e));
    return r.json();
  });
}

function showToast(msg, type='info') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function showLoading(v) { document.getElementById('loading').style.display = v ? 'flex' : 'none'; }

function fmtTime(t) {
  if (!t) return '-';
  return new Date(t).toLocaleString('zh-CN');
}

function switchTab(el, tabId) {
  el.closest('.tabs').querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  el.closest('.tab-content')?.parentElement?.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById(tabId)?.classList.add('active');
}

// 初始化
renderPage('dashboard');
api('/config').then(cfg => {
  document.getElementById('ai-status').textContent = (cfg.ai||{}).api_key ? '● 已配置' : '● 未配置';
});
